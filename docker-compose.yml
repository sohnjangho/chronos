services:
  backend:
    build: ./backend
    # 끌 때 통화 일꾼이 살아 있는 통화를 끝내기까지 20초를 기다린다 — Docker 기본 10초면 그 전에 SIGKILL 된다
    stop_grace_period: 40s
    ports:
      - "0.0.0.0:8210:8210"
    env_file:
      - path: .env
        required: false
    environment:
      CHRONOS_DATA_DIR: /data
    volumes:
      - ./backend:/app
      - ./data:/data

  frontend:
    build: ./frontend
    ports:
      - "0.0.0.0:5600:5600"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
