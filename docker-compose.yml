services:
  backend:
    build: ./backend
    ports:
      - "0.0.0.0:8200:8200"
    env_file:
      - path: .env
        required: false
    environment:
      CHRONOS_DATA_DIR: /data
    volumes:
      - ./backend:/app
      - ./data:/data

  frontend:
    build: ./frontend
    ports:
      - "0.0.0.0:5600:5600"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  frontend_node_modules:
