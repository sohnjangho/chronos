[project]
name = "chronos-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]==0.165.0",
    "SQLAlchemy==2.1.9",
    "bcrypt==5.0.0",
    "itsdangerous==2.2.0",
    "cryptography==50.0.2",
    "httpx==0.28.1",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "ruff==0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py313"
