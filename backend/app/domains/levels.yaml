# 정밀도 5단계 — 에이전트에게 주는 정의(설계 11-2).
# 질문 수는 정하지 않는다. 에이전트는 고른 단계의 정의를 채우는 데 모자란 것만 묻는다.
#
# wbs_depth·activity_count 는 [최소, 최대]. activity_count 가 null 이면 "고른 구간만"(L5).
# time_unit: 월 | 주 | 일 | 일·교대 · resources: 없음 | 주요 자원

- id: L1
  name: 마스터
  use: 경영 보고·제안
  wbs_depth: [1, 2]
  activity_count: [10, 20]
  time_unit: 월
  resources: 없음
  must_contain: 주요 단계와 착공·준공

- id: L2
  name: 요약
  use: 타당성·계약
  wbs_depth: [2, 3]
  activity_count: [20, 40]
  time_unit: 주
  resources: 없음
  must_contain: 단계별 기간, 중간 마일스톤, 인허가 대기

- id: L3
  name: 관리
  use: 계획 수립·월간 보고
  wbs_depth: [3, 3]
  activity_count: [50, 100]
  time_unit: 일
  resources: 주요 자원
  must_contain: 공종별 액티비티, 선후 관계, 달력, 주요 자원

- id: L4
  name: 실행
  use: 주간 관리
  wbs_depth: [4, 4]
  activity_count: [100, 200]
  time_unit: 일
  resources: 주요 자원
  must_contain: 작업 단위 액티비티, 기준 기간, 예비 기간, 실적

- id: L5
  name: 상세
  use: 3주 앞 작업 계획·작업 지시
  wbs_depth: [5, 5]
  activity_count: null
  time_unit: 일·교대
  resources: 주요 자원
  must_contain: 고른 구간의 작업 지시 수준
